<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeineReise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">

  <div id="demoBanner" class="demo-banner" hidden>Demo-Daten – keine Live-Anbindung konfiguriert</div>

  <main id="views" class="views">

    <section id="view-overview" class="view" data-view="overview">
      <div class="loading">Reise wird geladen …</div>
    </section>

    <section id="view-plan" class="view" data-view="plan" hidden></section>

    <section id="view-offers" class="view" data-view="offers" hidden></section>

    <section id="view-docs" class="view" data-view="docs" hidden></section>

    <section id="view-price" class="view" data-view="price" hidden></section>

    <section id="view-office" class="view" data-view="office" hidden></section>

    <section id="view-hotel" class="view" data-view="hotel" hidden></section>

    <section id="view-cruise" class="view" data-view="cruise" hidden></section>

  </main>

  <nav class="bottom-nav">
    <div class="sidebar-brand" aria-hidden="true">MeineReise</div>
    <button class="nav-item is-active" data-nav="overview">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Start</span>
    </button>
    <button class="nav-item" data-nav="plan">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v18M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/></svg>
      <span>Reiseplan</span>
    </button>
    <button class="nav-item" data-nav="offers">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2H4a2 2 0 0 0-2 2v8.6c0 .5.2 1 .6 1.4l9 9a2 2 0 0 0 2.8 0l7.6-7.6a2 2 0 0 0 0-2.8l-9-9c-.4-.4-.9-.6-1.4-.6Z"/><circle cx="8" cy="8" r="1.5"/></svg>
      <span>Angebote</span>
    </button>
    <button class="nav-item" data-nav="docs">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6"/></svg>
      <span>Dokumente</span>
    </button>
    <button class="nav-item" data-nav="price">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      <span>Reisepreis</span>
    </button>
    <button class="nav-item" data-nav="office">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h1M8 10h1M8 14h1M15 6h1M15 10h1M15 14h1"/></svg>
      <span>Mein Reisebüro</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
